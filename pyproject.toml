[project]
name = "openai-stream-sentinel"
version = "0.2.0"
description = "Client-side streaming diagnostics with reproducible HTTP failure investigations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
sentinel = "openai_stream_sentinel.cli:main"
openai-stream-sentinel = "openai_stream_sentinel.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
