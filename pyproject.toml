[project]
name = "openai-stream-sentinel"
version = "0.1.0"
description = "Enterprise OpenAI API Streaming Observability & Auto-RCA Diagnostic Probe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "rich>=13.7.0",
]

[project.scripts]
sentinel = "openai_stream_sentinel.cli:main"
openai-stream-sentinel = "openai_stream_sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
